services:
  todo_db_app:
    image: postgres:15
    container_name: todo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/database/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - todo_network

  todo_app:
    build: .
    container_name: todo_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/code/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - todo_db_app
    networks:
      - todo_network

volumes:
  pgdata:

networks:
  todo_network:
    driver: bridge